<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Brief</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="news_style.css">
</head>
<body>

    <header>
        <h1>Daily Brief</h1>
        <div class="search-wrapper">
            <input type="text" id="search-input" placeholder="Search headlines...">
        </div>
    </header>

    <nav>
        <div class="nav-container" id="nav-container">
            </div>
    </nav>

    <main>
        <div class="source-header" id="source-header">
            <div class="source-logo" id="source-logo">SP</div>
            <div class="source-title">Headlines from <span id="source-name">...</span></div>
        </div>

        <div class="news-grid" id="news-grid">
            </div>
    </main>

    <script src="script_news.js"></script>
</body>
</html>
